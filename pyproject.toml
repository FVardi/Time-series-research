[project]
name = "time-series-research"
version = "0.1.0"
description = "Harness for self-supervised learning on time series (bearing condition monitoring)"
requires-python = ">=3.12"  # D14
dependencies = [
    "antropy",  # Hjorth parameters in the MSSP statistics (harness/methods/mssp_features.py, D82)
    "einops",  # imported by the official TS-TCC Transformer (external/tstcc/models/attention.py, D104)
    "h5py",
    "numba",  # MiniRocket (external/minirocket, D81)
    "numpy",
    "pycatch22==1.0.2",  # catch24 baseline (D85, D90); exact version: v1.0 changed the feature values
    "pandas",
    "pyarrow",  # Parquet files for the metadata tables (D3)
    "pyyaml",  # config files (D16)
    "scikit-learn",  # probes (D15)
    "scipy",  # band filter in the MSSP statistics (harness/methods/mssp_features.py)
    "torch",  # D15
    "tqdm",  # imported by the official PatchTST Learner (external/patchtst)
]

[dependency-groups]
dev = ["pytest"]
# Notebooks and plots for dataset examination in eda/ (D68): uv sync --group eda
eda = ["jupyter", "matplotlib", "scipy"]

# Makes 'harness' an installable library (D11); uv installs it in editable mode.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
pythonpath = ["."]  # lets tests import from scripts/

# PyTorch with GPU support: the work computer's NVIDIA driver supports CUDA 13.0,
# so PyTorch is installed from its CUDA 13.0 package index (not from PyPI).
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true  # only torch comes from this index; everything else from PyPI
