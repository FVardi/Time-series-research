# Random-init baseline (D134), variant (b) bn_from_train: the encoder as built, batch-norm statistics from the training series, untrained (no pretraining).
# Copy of configs/patchtst_forda.yaml except this header, name, random_init, probes (no svm_ts2vec, D135) and published_accuracy;
# tests/test_random_init.py checks that everything else still matches.

# PatchTST (self-supervised) on FordA. Same data, probes, label budgets and seeds as
# configs/ts2vec_forda.yaml (D26, D27, D29, D40). Every setting is written out with its source.
# Decisions: D73 (wrapped official code), D74 (settings), D87 (pooling).
# Sources: paper = arXiv 2211.14730v2; script = PatchTST_self_supervised/patchtst_pretrain.py
# (argument defaults and get_model); class = PatchTST class defaults the script does not override;
# all at commit 204c21e.
defaults: [methods/patchtst.yaml]  # shared settings (D260), merged in this order; keys below override them
name: patchtst_forda_random_bn
dataset: forda
run_id: forda
channels: [x]
data_root: data/canonical
random_init: bn_from_train  # D134
seeds: [0, 1, 2]  # D26

evaluation:  # D26, D40
  label_fractions: [0.01, 0.1, 1.0]
  probes: [logreg]  # D135: no svm_ts2vec (reproduction only, D133; nothing published for an untrained encoder)
  published_accuracy: null  # D134: nothing published for an untrained encoder
