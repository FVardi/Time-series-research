# D67: choose TS-JEPA's learning rate on a validation split of FordA's training series.
# Every other TS-JEPA setting comes from base_config (copied into the run folder).
name: tsjepa_forda_lr_search
base_config: configs/tsjepa_forda_fixed.yaml  # masking per_sample, 5000 epochs, 1 layer, mean pooling (D66)
learning_rates: [1.0e-3, 1.0e-4, 1.0e-5, 1.0e-6]  # the values the paper searched; tried in this order
validation_fraction: 0.2  # of FordA's training series, stratified by class, held out from pretraining
split_seed: 0  # seed of the 80/20 split
seed: 0  # pretraining seed (one seed)
selection: logreg_accuracy  # D67: logistic-regression probe (D26, D29) on the 80 %, accuracy on the 20 %
