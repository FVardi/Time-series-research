# TS-JEPA (masking fixed, channels flattened per patch) on Paderborn: Lessmeier et al. (2016) Section 7.3 (D220), inputs D222, pretraining on the training windows (D225).
# Settings as tsjepa_cwru.yaml; only the values the input shape forces are changed (D151, D256).
# All 10 combinations, seed 0 (D239):
#   uv run python scripts/run_combinations.py configs/tsjepa_paderborn.yaml --seeds 0
defaults: [datasets/paderborn.yaml, methods/tsjepa.yaml]  # shared settings (D260), merged in this order; keys below override them
name: tsjepa_paderborn

tsjepa:
  epochs: 2004  # D256: FordA's optimiser steps (D66: 5,000 epochs x 113 batches = 565,000); here about 9,000 windows = 282 batches
                # per epoch in every combination: 565,000 / 282 = 2,004 epochs. LR and EMA schedules run over these epochs
