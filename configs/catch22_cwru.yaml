# Baseline (D85, D90) on CWRU: catch24 features (catch22 + mean and SD) per channel, pycatch22 1.0.2, probed directly.
name: catch22_cwru
dataset: cwru
data_root: data/canonical
channels: [DE, FE]  # D131
labels: cwru  # class = fault location (+ clock hour), group = faulty bearing (harness/labels.py; D118, D125)
windows:  # D136, D137
  length: 2048
  sample_rate_hz: 12000  # normal files (48 kHz) resampled to 12 kHz
  standardise: false  # baselines on raw values (D76, D137)
split:  # filters on the captures table (D128, D140, D147)
  train: {sample_rate_hz: 12000, fault_end: [DE, FE], fault_size_mil: [7, 14]}
  test: {sample_rate_hz: 12000, fault_end: [DE, FE], fault_size_mil: [21]}
  pretrain_only: {fault_end: [none]}  # normal files, unlabelled (D126)
method: catch22
seeds: [0, 1, 2]  # the SSL runs' seeds, so the label subsets are the same (D78)
device: cpu  # pycatch22 is CPU code (D79)

catch22:
  catch24: true  # D85: add mean and SD
  mask_nans: false  # D90: a feature that cannot be estimated gives NaN and the run stops

evaluation:  # D26, D40, D129, D133, D138
  label_fractions: [0.01, 0.1, 1.0]
  probes: [logreg, floor]
  cv_groups: true  # logreg folds grouped by bearing, shuffled per seed (D129)
  published_accuracy: null  # nothing published for this split
