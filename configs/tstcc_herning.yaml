# TS-TCC (permutation fixed) on Herning (D151 as on CWRU, D156, D173): FordA settings with the values the input shape forces.
defaults: [datasets/herning.yaml, methods/tstcc.yaml]  # shared settings (D260), merged in this order; keys below override them
name: tstcc_herning
rankme_epsilon: 1.0e-7  # D152 (as D94): RankMe of the final training representations, diagnostic only

tstcc:  # D105: the TS2Vec paper's setup (Appendix C.3) = official HAR config, 320 output channels, batch 128
  changed:  # HAR values changed for the input shape (D105, D156); the HAR value in the comment
    input_channels: 48  # HAR 9; Herning: 12 bands x 4 features (D165)
    features_len: 27  # HAR 18; encoder output length for 200 steps (checked by the adapter); only sizes the unused classifier layer
    num_classes: 1  # HAR 6; only sizes the unused classifier layer (no classes: kappa is regressed by the probe)
