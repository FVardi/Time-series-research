# CWRU literature protocol (Zhao et al. 2020; D167, D177-D179): 10 classes, drive end, 0 hp, 1,024-sample windows.
# TS-TCC (permutation fixed) on CWRU (D167, D151, D156): FordA settings with the values the input shape forces.
defaults: [datasets/cwru.yaml, methods/tstcc.yaml]  # shared settings (D260), merged in this order; keys below override them
name: tstcc_cwru

tstcc:  # D105: the TS2Vec paper's setup (Appendix C.3) = official HAR config, 320 output channels, batch 128
  changed:  # HAR values changed for the input shape (D105, D156); the HAR value in the comment
    input_channels: 1  # HAR 9; drive end only (D167)
    features_len: 130  # HAR 18; encoder output length for 1024 samples; only sizes the unused classifier layer
    num_classes: 10  # HAR 6; only sizes the unused classifier layer
