# Random-init baseline (D134), variant (a) as_initialised: the encoder as built, untrained (no pretraining).
# Copy of configs/tsjepa_forda.yaml except this header, name, random_init, probes (no svm_ts2vec, D135) and published_accuracy;
# tests/test_random_init.py checks that everything else still matches.

# TS-JEPA on FordA, official code with the masking bug fixed (D66). Identical to configs/tsjepa_forda_official_masking.yaml except name and masking. Same data, probes, label budgets and seeds as
# configs/ts2vec_forda.yaml (D26, D27, D29, D40). Every setting is written out with its source.
# 'null' = open placeholder (the paper is silent and the code versions disagree): the run refuses to start.
# Sources: paper = arXiv 2509.25449; README = command in the repo README; code = config/config_pretrain.py
# and pretrain.py at commit 830ee5c.
defaults: [methods/tsjepa.yaml]  # shared settings (D260), merged in this order; keys below override them
name: tsjepa_forda_random
dataset: forda
run_id: forda
channels: [x]
data_root: data/canonical
random_init: as_initialised  # D134
seeds: [0, 1, 2]  # D26 (the paper reports 10 runs)

tsjepa:
  epochs: 5000  # D66; paper silent; code 5001 (README evaluates the checkpoint saved at epoch index 5000); 1 epoch = 113 batches on FordA

evaluation:  # D26, D40
  label_fractions: [0.01, 0.1, 1.0]
  probes: [logreg]  # D135: no svm_ts2vec (reproduction only, D133; nothing published for an untrained encoder)
  published_accuracy: null  # D134: nothing published for an untrained encoder
