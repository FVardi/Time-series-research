# Random-init baseline (D134), variant (a) as_initialised: the encoder as built, untrained (no pretraining).
# Copy of configs/frera_forda.yaml except this header, name, random_init, probes (no svm_ts2vec, D135) and published_accuracy;
# tests/test_random_init.py checks that everything else still matches.

# FreRA on FordA, official code wrapped (harness/methods/frera.py), framework SimCLR. Same data, probes,
# label budgets and seeds as configs/ts2vec_forda.yaml (D26, D27, D29, D40). Every setting is written out with its source.
# 'null' = open placeholder (the sources disagree or are silent): the run refuses to start.
# Sources: paper = arXiv 2505.23181v1 (KDD 2025); README = the three commands in the repo README (UCIHAR, WISDM,
# MotionSense; there is none for a UCR dataset); code = github.com/Tian0426/FreRA at commit 7236fbf
# (main_FreRA.py argument defaults and hard-coded values, data_preprocess/data_preprocess_ucr.py).
defaults: [methods/frera.yaml]  # shared settings (D260), merged in this order; keys below override them
name: frera_forda_random
dataset: forda
run_id: forda
channels: [x]
data_root: data/canonical
random_init: as_initialised  # D134
seeds: [0, 1, 2]  # D26

evaluation:  # D26, D40
  label_fractions: [0.01, 0.1, 1.0]
  probes: [logreg]  # D135: no svm_ts2vec (reproduction only, D133; nothing published for an untrained encoder)
  published_accuracy: null  # D134: nothing published for an untrained encoder
