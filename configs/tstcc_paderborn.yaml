# TS-TCC (permutation fixed) on Paderborn: Lessmeier et al. (2016) Section 7.3 (D220), inputs D222, pretraining on the training windows (D225).
# Settings as tstcc_cwru.yaml; only the values the input shape forces are changed (D151, D256).
# All 10 combinations, seed 0 (D239):
#   uv run python scripts/run_combinations.py configs/tstcc_paderborn.yaml --seeds 0
defaults: [datasets/paderborn.yaml, methods/tstcc.yaml]  # shared settings (D260), merged in this order; keys below override them
name: tstcc_paderborn

tstcc:  # D105: the TS2Vec paper's setup (Appendix C.3) = official HAR config, 320 output channels, batch 128
  changed:  # HAR values changed for the input shape (D105, D156); the HAR value in the comment
    input_channels: 1  # HAR 9; vibration only (D222)
    features_len: 642  # HAR 18; encoder output length for 5,120 samples; only sizes the unused classifier layer
    num_classes: 3  # HAR 6; only sizes the unused classifier layer
