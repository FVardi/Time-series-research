# TS-TCC (permutation fixed) on Paderborn: Lessmeier et al. (2016) Section 7.3 (D220), inputs D222, pretraining on the training windows (D225).
# Settings as tstcc_cwru.yaml; only the values the input shape forces are changed (D151, D256).
# All 10 combinations, seed 0 (D239):
#   uv run python scripts/run_combinations.py configs/tstcc_paderborn.yaml --seeds 0
name: tstcc_paderborn
dataset: paderborn
data_root: data/canonical
channels: [vibration_1]  # vibration only (D222)
labels: paderborn_lessmeier  # healthy / OR / IR for the 15 bearings of Table 10; group = bearing (harness/labels.py; D220)
windows:  # D222
  length: 5120  # 80 ms at 64 kHz, as TF-C's FD-A/FD-B windows (D39)
  sample_rate_hz: 64000
  standardise: true  # per channel, statistics of the pretraining windows (D137)
split: {protocol: paderborn_lessmeier}  # one run per combination k = 0..9 (D220, D225)
method: tstcc
seeds: [0]  # standard run: seed 0 (D239)
device: cuda
rankme_epsilon: 1.0e-7  # D152 (as D94): RankMe of the final training representations, diagnostic only

tstcc:  # D105: the TS2Vec paper's setup (Appendix C.3) = official HAR config, 320 output channels, batch 128
  weight_decay: 0.0003  # hard-coded in the official main.py for both Adam optimisers
  # lambda1 = 1 and lambda2 = 0.7 are hard-coded in the official model_train (not settable here)
  official_config:  # external/tstcc/config_files/HAR_Configs.py; checked by the adapter, a difference stops the run
    kernel_size: 8
    stride: 1
    dropout: 0.35
    num_epoch: 40
    batch_size: 128  # also the TS2Vec paper's batch size for UCR datasets
    beta1: 0.9
    beta2: 0.99
    lr: 0.0003
    drop_last: true
    augmentation.jitter_scale_ratio: 1.1  # σ of the weak view's scaling (D107 item 2)
    augmentation.jitter_ratio: 0.8  # σ of the strong view's jitter
    augmentation.max_seg: 8  # strong view: 1..7 segments (D107 item 4)
    TC.hidden_dim: 100
    TC.timesteps: 6
    Context_Cont.temperature: 0.2
    Context_Cont.use_cosine_similarity: true
  changed:  # HAR values changed for the input shape (D105, D156); the HAR value in the comment
    input_channels: 1  # HAR 9; vibration only (D222)
    final_out_channels: 320  # HAR 128; TS2Vec paper: representation dimension 320 for every baseline
    features_len: 642  # HAR 18; encoder output length for 5,120 samples; only sizes the unused classifier layer
    num_classes: 3  # HAR 6; only sizes the unused classifier layer

evaluation:  # D26, D40, D129, D133, D138
  label_fractions: [0.01, 0.1, 1.0]
  probes: [logreg, floor]
  cv_groups: true  # logreg folds grouped by bearing, shuffled per seed (D129)
  published_accuracy: null  # Lessmeier et al. report accuracies of their own feature classifiers, not of a probe
