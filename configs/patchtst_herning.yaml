# PatchTST on Herning (D151 as on CWRU, D158, D173): FordA settings unchanged (channel-independent by design).
name: patchtst_herning
dataset: herning
data_root: data/canonical
channels: [AE, UL]
labels: herning  # kappa of the sweep's operating point; excluded sweeps have none (harness/labels.py; D55)
task: regression  # kappa is a number (D58)
windows:  # D165, D172
  length: 500000  # one window = one whole sweep (0.2 s at 2.5 MHz)
  sample_rate_hz: 2500000  # as recorded; the band features need the full rate (D165 item 2)
  features: band  # 1 ms windows, 12 octave bands x 4 features: (200, 48) per sweep (harness/band_features.py)
  features_file: data/derived/herning/band_features.h5  # stored features (D172; scripts/derive_features.py, feature set band)
  standardise: true  # each of the 48 channels with the mean and SD of the training sweeps (D165 item 5)
split:  # D169: the sweeps with kappa, 80/20 at random, one fixed draw
  captures: {}  # no filter: every sweep with a label
  random: {test_fraction: 0.2, seed: 0}
method: patchtst
seeds: [0, 1, 2]
device: cuda
rankme_epsilon: 1.0e-7  # D152 (as D94): RankMe of the final training representations, diagnostic only

patchtst:
  patch_len: 12  # D74, unchanged (D158, D173): 200 steps -> 16 patches, the first 8 steps of each
                 # series unused (official create_patch)
  stride: 12  # D74: = patch_len. paper: non-overlapping patches for pretraining ("so observed patches do not
              # contain information of the masked ones"); script default 12
  mask_ratio: 0.4  # paper ("40% of the patches are masked with zero values"), script, README
  revin: true  # script (--revin 1); paper: instance normalisation of every series
  revin_eps: 1.0e-5  # RevInCB default (script does not set it)
  batch_size: 64  # script (only source; paper silent)
  epochs: 100  # D74: paper ("pre-training ... for 100 epochs"); script default 10
  lr: finder  # D74: what the script does by itself: the official learning-rate finder, then training with its
              # suggestion (--lr 1e-4 is then unused); paper silent. The value used is saved per seed
  pct_start: 0.3  # script (fit_one_cycle default): share of the batches with rising learning rate
  validation_fraction: 0.125  # D74: share of the training series held out (random, no labels) to keep the epoch
                              # with the lowest validation loss, as the script does (SaveModelCB on valid_loss).
                              # 0.125 is derived, not stated: the script's generic datasets split time 70/10/20,
                              # i.e. validation = 1/8 of the non-test data
  model:
    n_layers: 3  # paper (default size), script
    n_heads: 16  # paper (default size), script; D74: default size (the paper's reduced size, 4 heads, is for
                 # datasets smaller than FordA)
    d_model: 128  # paper (default size), script; reduced size 16 not used (D74)
    d_ff: 256  # D74: paper (default size); script 512
    dropout: 0.2  # paper ("all experiments"), script
    head_dropout: 0.2  # script (only source); acts on the pretraining head only
    attn_dropout: 0.0  # class
    shared_embedding: true  # script: one patch projection for all channels
    norm: BatchNorm  # class
    act: relu  # script (class default would be gelu)
    res_attention: false  # script (class default would be true)
    pre_norm: false  # class
    pe: zeros  # class: learned positional encoding, initialised uniformly in [-0.02, 0.02]
    learn_pe: true  # class
  pooling: mean  # D87: mean over the patch vectors per channel, channels concatenated (supersedes D74's 'last',
                 # the official heads' choice: 7-16 points weaker on FordA, D86); paper silent
  encode_batch_size: 256  # series per forward pass when encoding; does not change results


evaluation:  # D40, D58, D59, D170
  label_fractions: [0.01, 0.1, 1.0]
  probes: [ridge, floor_mean]
  published_accuracy: null  # nothing published
