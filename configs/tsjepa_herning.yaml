# TS-JEPA (masking fixed, channels flattened per patch) on Herning (D151 as on CWRU, D154, D173).
defaults: [datasets/herning.yaml, methods/tsjepa.yaml]  # shared settings (D260), merged in this order; keys below override them
name: tsjepa_herning
rankme_epsilon: 1.0e-7  # D152 (as D94): RankMe of the final training representations, diagnostic only

tsjepa:
  epochs: 5000  # D66; paper silent; code 5001 (README evaluates the checkpoint saved at epoch index 5000); 1 epoch = 113 batches on FordA
