# TS2Vec on CWRU (D163, D151, D153): official settings, dataset sections for CWRU.
name: ts2vec_cwru
dataset: cwru
data_root: data/canonical
channels: [DE, FE]  # D131
labels: cwru  # class = fault location (+ clock hour), group = faulty bearing (harness/labels.py; D118, D125)
windows:  # D136, D137
  length: 2048
  sample_rate_hz: 12000  # normal files (48 kHz) resampled to 12 kHz
  standardise: true  # per channel, statistics of the pretraining windows (D137)
split:  # windows split at random (D163); pretraining = training + pretrain_only windows (D164)
  captures: {sample_rate_hz: 12000, fault_end: [DE, FE], fault_size_mil: [7, 14, 21]}  # labelled windows (D117, D119, D140)
  random_windows: {test_fraction: 0.2, random_state: 40}  # stratified by class, fixed for all seeds, as Zhao et al. (D171, D174)
  pretrain_only: {fault_end: [none]}  # normal files, unlabelled (D126, D164)
method: ts2vec
seeds: [0, 1, 2]
device: cuda
rankme_epsilon: 1.0e-7  # D152 (as D94): RankMe of the final training representations, diagnostic only

ts2vec:  # official defaults (D28), unchanged on CWRU (D151, D153)
  repr_dims: 320
  hidden_dims: 64
  depth: 10
  lr: 0.001
  batch_size: 8
  max_train_length: 3000  # windows are 2048 samples, so not cropped
  temporal_unit: 0
  n_iters: 600  # TS2Vec's rule: 200 if the training data has <= 100,000 values, else 600 (CWRU: 4781 pretraining windows x 2048 x 2)

evaluation:  # D26, D40, D133, D138, D175
  label_fractions: [0.01, 0.1, 1.0]
  probes: [logreg, floor]
  cv_groups: false  # plain stratified 5-fold, not grouped: the split is by random windows (D175)
  published_accuracy: null  # nothing published for this split
