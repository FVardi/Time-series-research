# CWRU literature protocol (Zhao et al. 2020; D167, D177-D179): 10 classes, drive end, 0 hp, 1,024-sample windows.
# TS2Vec on CWRU (D167, D151, D153): official settings, dataset sections for CWRU.
name: ts2vec_cwru
dataset: cwru
data_root: data/canonical
channels: [DE]  # drive end only, as Zhao et al. (D167)
labels: cwru_zhao  # healthy + fault location x size, 10 classes (harness/labels.py; D167)
windows:  # D136, D137
  length: 1024  # as Zhao et al. (D167)
  sample_rate_hz: 12000  # healthy file 97 (48 kHz) resampled to 12 kHz (D167)
  standardise: true  # per channel, statistics of the pretraining windows (D137)
split:  # windows split at random (D167, D174); pretraining = training windows (D164)
  captures: {source_file: [97, 105, 118, 130, 169, 185, 197, 209, 222, 234]}  # Zhao et al.'s files: 0 hp, healthy + 9 drive-end faults (D167)
  random_windows: {test_fraction: 0.2, random_state: 40}  # stratified by class, fixed for all seeds, as Zhao et al. (D171, D174)
method: ts2vec
seeds: [0]  # standard run: seed 0 (D239)
device: cuda
rankme_epsilon: 1.0e-7  # D152 (as D94): RankMe of the final training representations, diagnostic only

ts2vec:  # official defaults (D28), unchanged on CWRU (D151, D153)
  repr_dims: 320
  hidden_dims: 64
  depth: 10
  lr: 0.001
  batch_size: 8
  max_train_length: 3000  # windows are 1024 samples, so not cropped
  temporal_unit: 0
  n_iters: 600  # TS2Vec's rule: 200 if the training data has <= 100,000 values, else 600 (here: about 900 training windows x 1024 x 1)

evaluation:  # D26, D133, D178, D179
  label_fractions: [0.1, 1.0]  # 1 % dropped: fewer labels than classes (D178)
  probes: [logreg, floor]
  cv_groups: false  # plain stratified 5-fold, not grouped (D179)
  per_class: true  # test accuracy per class, logreg probe (D168, D179)
  published_accuracy: null  # Zhao et al. train each network end to end; no probe result to compare with
