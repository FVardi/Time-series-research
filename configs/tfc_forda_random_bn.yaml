# Random-init baseline (D134), variant (b) bn_from_train: the encoder as built, batch-norm statistics from the training series, untrained (no pretraining).
# Copy of configs/tfc_forda.yaml except this header, name, random_init, probes (no svm_ts2vec, D135) and published_accuracy;
# tests/test_random_init.py checks that everything else still matches.

# TF-C, our implementation (D41) with the benchmark loss (D122), on FordA in the harness's
# frozen-probe pipeline (D123): scripts/pretrain.py + scripts/evaluate.py, same data, probes and
# seeds as configs/ts2vec_forda.yaml (D26, D27). Representation [z_T; z_F] (D123).
# TF-C settings as in the FordA ablation (= studies/tfc_reproduction/configs/tfc_fd.yaml), D124; source of each value in its comment.
defaults: [methods/tfc.yaml]  # shared settings (D260), merged in this order; keys below override them
name: tfc_forda_random_bn
dataset: forda
run_id: forda
channels: [x]
data_root: data/canonical
random_init: bn_from_train  # D134
seeds: [0, 1, 2]  # D26: 3 seeds

evaluation:  # D26, D40
  label_fractions: [0.01, 0.1, 1.0]
  probes: [logreg]  # D135: no svm_ts2vec (reproduction only, D133; nothing published for an untrained encoder)
  published_accuracy: null  # D134: nothing published for an untrained encoder
