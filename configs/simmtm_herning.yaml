# SimMTM on Herning (D151 as on CWRU, D159, D173): all 48 channels encoded and rebuilt; shape-forced values in 'changed'.
defaults: [datasets/herning.yaml, methods/simmtm.yaml]  # shared settings (D260), merged in this order; keys below override them
name: simmtm_herning
rankme_epsilon: 1.0e-7  # D152 (as D94): RankMe of the final training representations, diagnostic only

simmtm:
  changed:  # SleepEEG values changed for the input shape (D159); the SleepEEG value in the comment
    TSlength_aligned: 200  # 178; Herning series length (the decoder outputs input_channels x this many values, D159)
    CNNoutput_channel: 10  # 10; encoder output length for 200 steps (checked by the adapter)
    input_channels: 48  # 1; the 48 band features, all encoded and rebuilt (D159, D165)
