# TS-TCC on FordA (D104-D108). Same data, probes and seeds as configs/ts2vec_forda.yaml (D26, D27).
# Every setting is written out; nothing is filled in by the code.
defaults: [datasets/forda.yaml, methods/tstcc.yaml]  # shared settings (D260), merged in this order; keys below override them
name: tstcc_forda

tstcc:  # D105: the TS2Vec paper's setup (Appendix C.3) = official HAR config, 320 output channels, batch 128
  changed:  # HAR values changed for FordA (D105); the HAR value in the comment
    input_channels: 1  # HAR 9; FordA has one channel
    features_len: 65  # HAR 18; encoder output length for 500 samples; only sizes the unused classifier layer
    num_classes: 2  # HAR 6; only sizes the unused classifier layer

evaluation:  # D26, D108
  probes: [svm_ts2vec, logreg]
  reproduction_probe: svm_ts2vec  # the protocol the TS2Vec paper used for its baselines
  published_accuracy: 0.930  # TS2Vec paper (arXiv 2106.10466), Table 9, TS-TCC on FordA
