# TS-JEPA (masking fixed, channels flattened per patch) on HUST, the dataset authors' 7-class classification protocol (Thuan & Hong, arXiv 2302.12533; D226).
# Settings as tsjepa_cwru.yaml; only the values the input shape forces are changed (D151, D256).
#   uv run python scripts/pretrain.py configs/tsjepa_hust.yaml --seeds 0
defaults: [datasets/hust.yaml, methods/tsjepa.yaml]  # shared settings (D260), merged in this order; keys below override them
name: tsjepa_hust

tsjepa:
  epochs: 1290  # D256: FordA's optimiser steps (D66: 5,000 epochs x 113 batches = 565,000); here 14,000 windows = 438 batches
                # per epoch: 565,000 / 438 = 1,290 epochs. LR and EMA schedules run over these epochs
