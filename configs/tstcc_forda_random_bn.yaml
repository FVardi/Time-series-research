# Random-init baseline (D134), variant (b) bn_from_train: the encoder as built, batch-norm statistics from the training series, untrained (no pretraining).
# Copy of configs/tstcc_forda.yaml except this header, name, random_init, probes (no svm_ts2vec, D135) and published_accuracy;
# tests/test_random_init.py checks that everything else still matches.

# TS-TCC on FordA (D104-D108). Same data, probes and seeds as configs/ts2vec_forda.yaml (D26, D27).
# Every setting is written out; nothing is filled in by the code.
defaults: [methods/tstcc.yaml]  # shared settings (D260), merged in this order; keys below override them
name: tstcc_forda_random_bn
dataset: forda
run_id: forda
channels: [x]
data_root: data/canonical
random_init: bn_from_train  # D134
seeds: [0, 1, 2]  # D108

tstcc:  # D105: the TS2Vec paper's setup (Appendix C.3) = official HAR config, 320 output channels, batch 128
  changed:  # HAR values changed for FordA (D105); the HAR value in the comment
    input_channels: 1  # HAR 9; FordA has one channel
    features_len: 65  # HAR 18; encoder output length for 500 samples; only sizes the unused classifier layer
    num_classes: 2  # HAR 6; only sizes the unused classifier layer

evaluation:  # D26, D108
  label_fractions: [0.01, 0.1, 1.0]
  probes: [logreg]  # D135: no svm_ts2vec (reproduction only, D133; nothing published for an untrained encoder)
  published_accuracy: null  # D134: nothing published for an untrained encoder
