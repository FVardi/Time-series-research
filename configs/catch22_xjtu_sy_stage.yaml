# Baseline (D85, D90): catch24 features (catch22 + mean and SD) per channel, pycatch22 1.0.2, probed directly, on the XJTU-SY health-stage task (D191 task 3; D230, D231, D232 item 7, D254).
# Same data, split and evaluation as tfc_xjtu_sy_stage.yaml; standardised as every input (D253, D255).
#   uv run python scripts/pretrain.py configs/catch22_xjtu_sy_stage.yaml --seeds 0
name: catch22_xjtu_sy_stage
dataset: xjtu_sy
data_root: data/canonical
channels: [Horizontal_vibration_signals, Vertical_vibration_signals]  # both (D232 item 2)
labels: xjtu_sy_health_stage  # FPT of D230 (harness/fpt.py); group = bearing
windows:  # D254 (supersedes D247 item 1 and D232 item 3)
  length: 32768  # one window = one whole one-minute sample (1.28 s), as recorded (D232 item 1, restored by D254)
  sample_rate_hz: 25600  # as recorded (D224)
  standardise: true  # per channel, statistics of the pretraining windows (D137; harness standard D253, extended to baselines by D255)
split:  # DSCN Table 1 (D231), without the bearings left out by D230 item 5
  train: {bearing: [Bearing1_1, Bearing1_2, Bearing1_3, Bearing1_4, Bearing2_1, Bearing2_2, Bearing2_3, Bearing3_1, Bearing3_3]}
  test: {bearing: [Bearing1_5, Bearing2_5]}  # Bearing3_5 left out (no FPT, D230)
  pretrain_only: {bearing: [Bearing2_4, Bearing3_2, Bearing3_4]}  # no labels (D230), still pretraining data (D231 item 3)
method: catch22
seeds: [0]  # standard run: seed 0 (D239)
device: cpu  # pycatch22 is CPU code (D79)
rankme_epsilon: 1.0e-7  # D152 (as D94): RankMe of the final training representations, diagnostic only

catch22:
  catch24: true  # D85: add mean and SD
  mask_nans: false  # D90: a feature that cannot be estimated gives NaN and the run stops

evaluation:  # D26, D129, D232 item 7
  label_fractions: [0.01, 0.1, 1.0]
  probes: [logreg, floor]
  cv_groups: true  # logreg folds grouped by bearing, shuffled per seed (D129)
  published_accuracy: null  # no published result for this task
