# Shared settings of every minirocket config (D260): the method's settings that do not depend on the dataset.
# Configs name this file under 'defaults:'; their own keys override it (deep merge).
# Current rules for this method: docs/methods/. Taken from configs/minirocket_forda.yaml on 2026-11-12.
method: minirocket
device: cpu  # MiniRocket is CPU code (numba) (D79)
minirocket:  # official defaults of fit() in code/minirocket.py (D76)
  num_features: 10000  # 84 kernels x 119 = 9,996 features in practice
  max_dilations_per_kernel: 32
