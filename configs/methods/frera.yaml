# Shared settings of every frera config (D260): the method's settings that do not depend on the dataset.
# Configs name this file under 'defaults:'; their own keys override it (deep merge).
# Current rules for this method: docs/methods/. Taken from configs/frera_forda.yaml on 2026-11-12.
method: frera
device: cuda
frera:
  batch_size: 128  # README (all three commands); paper: "selected from {256, 128, 64, 32, 16, 5} according to the scale of the dataset"
  drop_last: true  # code (UCR loader, hard-coded); also required by the official NT-Xent, built for full batches
  epochs: 200  # README; paper: "maximum training epoch is set to 200 for all the experiments"
  lr: 0.01  # SGD learning rate. README (all three commands); paper: selected from {0.03, 0.01, 0.003, 0.001}
  momentum: 0.9  # SGD momentum: code (argument default)
  weight_decay: 1.0e-4  # SGD weight decay: code (argument default)
  temperature: 0.2  # τ of NT-Xent: paper ("fixed at 0.2"), README
  low_dim: 128  # projector output size: paper, code
  f_lr: 0.001  # learning rate for the frequency weights s: README (code default 0.01)
  f_temperature: 0.1  # τ_w of the Gumbel sigmoid: README, code default; paper: selected from {0.1, 0.2}
  f_optimizer:  # code: AdamW(aug_f.parameters(), lr=f_lr), everything else PyTorch's defaults; paper: "Adam for s"
    betas: [0.9, 0.999]  # PyTorch AdamW default
    eps: 1.0e-8  # PyTorch AdamW default
    weight_decay: 0.01  # PyTorch AdamW default (applies decay to s; Adam, as in the paper, would have none)
  l1_weight: 0.1  # D112: main_FreRA.py argument default (as D69). code: loss += l1_weight / len_sw * sum|w_crit|
                 #   (divides by the series length L);
                   #   README: 0.003; argument default: 0.1.
                   #   paper: λ * (1/F) * sum|w_crit| (divides by F = L//2 + 1, so λ ≈ l1_weight / 2),
                   #   λ searched in {0.1, 0.3, 1, 3, 10, 30} (best UCIHAR 1, MS 10, WISDM 3)
  encode_batch_size: 256  # series per forward pass when encoding; does not change results
