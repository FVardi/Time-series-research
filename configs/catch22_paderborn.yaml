# Baseline (D85, D90): catch24 features (catch22 + mean and SD) per channel, pycatch22 1.0.2, probed directly, on Paderborn: Lessmeier et al. (2016) Section 7.3 (D220), inputs D222, pretraining on the training windows (D225).
name: catch22_paderborn
dataset: paderborn
data_root: data/canonical
channels: [vibration_1]  # vibration only (D222)
labels: paderborn_lessmeier  # healthy / OR / IR for the 15 bearings of Table 10; group = bearing (harness/labels.py; D220)
windows:  # D222
  length: 5120  # 80 ms at 64 kHz, as TF-C's FD-A/FD-B windows (D39)
  sample_rate_hz: 64000
  standardise: true  # per channel, statistics of the pretraining windows (D137; harness standard D253, extended to baselines by D255)
split: {protocol: paderborn_lessmeier}  # one run per combination k = 0..9: pretrain.py --combination k, or scripts/run_combinations.py (D220, D225)
method: catch22
seeds: [0]  # standard run: seed 0 (D239)
device: cpu  # pycatch22 is CPU code (D79)
rankme_epsilon: 1.0e-7  # D152 (as D94): RankMe of the final training representations, diagnostic only

catch22:
  catch24: true  # D85: add mean and SD
  mask_nans: false  # D90: a feature that cannot be estimated gives NaN and the run stops

evaluation:  # D26, D40, D129, D133, D138
  label_fractions: [0.01, 0.1, 1.0]
  probes: [logreg, floor]
  cv_groups: true  # logreg folds grouped by bearing, shuffled per seed (D129)
  published_accuracy: null  # Lessmeier et al. report accuracies of their own feature classifiers, not of a probe
