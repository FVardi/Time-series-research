# SimMTM on HUST, the dataset authors' 7-class classification protocol (Thuan & Hong, arXiv 2302.12533; D226).
# Settings as simmtm_cwru.yaml; only the values the input shape forces are changed (D151, D256).
#   uv run python scripts/pretrain.py configs/simmtm_hust.yaml --seeds 0
defaults: [datasets/hust.yaml, methods/simmtm.yaml]  # shared settings (D260), merged in this order; keys below override them
name: simmtm_hust

simmtm:
  changed:  # SleepEEG values changed for the input shape (D159); the SleepEEG value in the comment
    TSlength_aligned: 2048  # 178; window length (D226; the decoder outputs input_channels x this many values, D159)
    CNNoutput_channel: 87  # 10; encoder output length for 2,048 samples (checked by the adapter)
    input_channels: 1  # 1; the only channel (D223)
