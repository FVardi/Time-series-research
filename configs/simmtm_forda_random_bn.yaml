# Random-init baseline (D130), variant (b) bn_from_train: the encoder as built, batch-norm statistics from the training series, untrained (no pretraining).
# Copy of configs/simmtm_forda.yaml except this header, name, random_init and published_accuracy;
# tests/test_random_init.py checks that everything else still matches.

# SimMTM on FordA, official classification code wrapped (harness/methods/simmtm.py). Same data, probes,
# label budgets and seeds as configs/ts2vec_forda.yaml (D26, D27, D29, D40). Every setting is written out with its source.
# 'null' = open placeholder (the sources disagree or are silent): the run refuses to start.
# Sources: paper = arXiv 2302.00861v4 (NeurIPS 2023); code = github.com/thuml/SimMTM at commit 169513b,
# SimMTM_Classification/code (main.py argument defaults, config_files/SleepEEG_Configs.py, trainer.py).
# The repository has one pretraining config (SleepEEG); there is none for FordA.
name: simmtm_forda_random_bn
dataset: forda
run_id: forda
channels: [x]  # the official Load_Dataset keeps channel 0 only; the adapter stops on more channels
data_root: data/canonical
method: simmtm
random_init: bn_from_train  # D130
seeds: [0, 1, 2]  # D26
device: cuda

simmtm:
  main_args:  # main.py argument defaults (run.sh does not change them for pretraining)
    pretrain_lr: 1.0e-4  # code; paper Table 10 (classification): 1e-4
    pretrain_epoch: 10  # code; paper Table 10: 10
    masking_ratio: 0.5  # code; paper: 50 % "throughout this paper"
    positive_nums: 3  # M, masked copies per series: code; paper: 3
    lm: 3  # mean length of a masked stretch (geometric masks): code only; paper compares geometric and random masking
    temperature: 0.2  # τ, contrastive loss and aggregation: code only (paper gives no classification value)
  adam:  # main.py: Adam(lr=pretrain_lr, betas=(beta1, beta2), weight_decay=0)
    weight_decay: 0.0  # code (hard-coded)
    eps: 1.0e-8  # PyTorch Adam default (code does not set it)
  official_config:  # SimMTM_Classification/code/config_files/SleepEEG_Configs.py; checked by the adapter,
                    # a difference stops the run. "unused" = not read during pretraining.
    input_channels: 1
    increased_dim: 1  # unused
    final_out_channels: 128  # encoder channels
    num_classes: 5  # unused
    num_classes_target: 8  # unused (fine-tuning classifier)
    dropout: 0.2  # dropout after the first convolution block
    masking_ratio: 0.5  # unused (main.py's argument is used)
    lm: 3  # unused (main.py's argument is used)
    kernel_size: 25  # first convolution
    stride: 3  # first convolution
    features_len: 127  # unused
    features_len_f: 127  # unused
    num_epoch: 40  # unused (main.py's pretrain_epoch is used)
    optimizer: adam  # unused (main.py builds Adam itself)
    beta1: 0.9
    beta2: 0.99
    lr: 3.0e-8  # unused (main.py's pretrain_lr is used)
    lr_f: 3.0e-8  # unused
    drop_last: true
    target_batch_size: 32  # unused (fine-tuning)
    Context_Cont.temperature: 0.2  # unused
    Context_Cont.use_cosine_similarity: true  # unused
    TC.hidden_dim: 64  # unused
    TC.timesteps: 50  # unused
    augmentation.jitter_scale_ratio: 1.5  # unused
    augmentation.jitter_ratio: 2  # unused
    augmentation.max_seg: 12  # unused
  changed:  # SleepEEG values changed for FordA; the SleepEEG value in the comment
    TSlength_aligned: 500  # 178; FordA series length (the decoder outputs this many samples)
    CNNoutput_channel: 23  # 10; encoder output length for 500 samples (checked by the adapter)
    batch_size: 128  # D111: paper Table 10 (classification pretraining); code (SleepEEG config): 32
  encode_batch_size: 256  # series per forward pass when encoding; does not change results

evaluation:  # D26, D40
  label_fractions: [0.01, 0.1, 1.0]
  probes: [svm_ts2vec, logreg]
  published_accuracy: null  # D130: nothing published for an untrained encoder
