# Random-init baseline (D134), variant (a) as_initialised: the encoder as built, untrained (no pretraining).
# Copy of configs/ts2vec_forda.yaml except this header, name, random_init, probes (no svm_ts2vec, D135) and published_accuracy;
# tests/test_random_init.py checks that everything else still matches.

# First slice: TS2Vec on FordA (D26, D27, D28). Every setting is written out; nothing is filled in by the code.
defaults: [methods/ts2vec.yaml]  # shared settings (D260), merged in this order; keys below override them
name: ts2vec_forda_random
dataset: forda
run_id: forda
channels: [x]
data_root: data/canonical
random_init: as_initialised  # D134
seeds: [0, 1, 2]

evaluation:  # D26
  label_fractions: [0.01, 0.1, 1.0]
  probes: [logreg]  # D135: no svm_ts2vec (reproduction only, D133; nothing published for an untrained encoder)
  published_accuracy: null  # D134: nothing published for an untrained encoder
