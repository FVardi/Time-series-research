# Consistency term only (D217 arm b): 'positives' with lambda = 0, loss (S_TF + sum S_pair) / 4.
# Everything else exactly as configs/tfc_xjtu_sy.yaml (the 'positives' arm); D243.
# XJTU-SY remaining useful life, the DSCN protocol (Wang et al., 2019; D228, D231, D232).
# TF-C (positives) on XJTU-SY (D123): settings as on CWRU, FordA and Paderborn (sized from the data).
# Run with --seeds 0 while exploring (D201):
#   uv run python scripts/pretrain.py configs/tfc_xjtu_sy.yaml --seeds 0
name: tfc_xjtu_sy_positives_lambda0
dataset: xjtu_sy
data_root: data/canonical
channels: [Horizontal_vibration_signals, Vertical_vibration_signals]  # both (D232 item 2)
labels: xjtu_sy_rul  # (N - n) / N, linear from the start (harness/labels.py; D228); group = bearing
task: regression
windows:  # D254 (supersedes D247 item 1 and D232 item 3)
  length: 32768  # one window = one whole one-minute sample (1.28 s), as recorded (D232 item 1, restored by D254)
  sample_rate_hz: 25600  # as recorded (D224)
  standardise: true  # per channel, statistics of the pretraining windows (D137; harness standard D253)
split:  # DSCN Table 1 (D231): bearings 1-4 of each condition train, bearing 5 test; pretraining = training windows
  train: {bearing: [Bearing1_1, Bearing1_2, Bearing1_3, Bearing1_4, Bearing2_1, Bearing2_2, Bearing2_3, Bearing2_4, Bearing3_1, Bearing3_2, Bearing3_3, Bearing3_4]}
  test: {bearing: [Bearing1_5, Bearing2_5, Bearing3_5]}
  pretrain_only: {bearing: []}  # selects no captures: every non-test bearing is a training bearing (D231 item 3)
method: tfc
seeds: [0]  # standard run: seed 0 (D239)
device: cuda
rankme_epsilon: 1.0e-7  # D152 (as D94): RankMe of the final training representations, diagnostic only

tfc:
  encoder:  # both branches; sized from the data (no setting changes, as D151)
    channels: [32, 64, 128]  # paper (as the ablation, D124)
    kernel_size: 8  # paper (as the ablation, D124); official FD_A config 32
    strides: [8, 1, 1]  # paper (as the ablation, D124)
    padding: 4  # not in paper; 2022 code, kernel_size // 2 (as the ablation, D124)
    pool_padding: 1  # not in paper; 2022 code (as the ablation, D124)
    conv_bias: false  # not in paper; 2022 code (as the ablation, D124)
    dropout_block1: 0.35  # not in paper; 2022 code, after the first block only (as the ablation, D124)
    projector: [256, 128]  # paper (as the ablation, D124)
  loss:
    variant: positives  # D122
    temperature: 0.2  # paper (as the ablation, D124)
    lambda: 0.0  # D217: consistency term only, no L_T and L_F
  freq_aug:
    n_components: 1  # paper, E (as the ablation, D124)
    alpha: 0.5  # paper (as the ablation, D124)
  time_aug:  # D42: one of three per window
    jitter_sigma: 0.1  # official FD_A config jitter_ratio (as the ablation, D124)
    scaling_mean: 1.0  # our choice, D42 (as the ablation, D124)
    scaling_sigma: 0.1  # our choice, D42 (as the ablation, D124)
    max_segments: 5  # official code, max_seg (as the ablation, D124)
  pretrain:
    epochs: 40  # paper (as the ablation, D124)
    batch_size: 64  # paper (as the ablation, D124); FordA: 56 steps per epoch
    drop_last: true  # code (as the ablation, D124)
    lr: 0.0003  # paper (as the ablation, D124)
    betas: [0.9, 0.99]  # code, paper silent (as the ablation, D124)
    weight_decay: 0.0005  # paper (as the ablation, D124)
  eval_chunk: 512  # series per forward pass when encoding; does not change results

evaluation:  # D231 item 4, D232 items 4-6
  label_fractions: [0.01, 0.1, 1.0]  # drawn unstratified over the embedded minutes (D170)
  probes: [ridge, floor_mean]  # one probe pooled over the three conditions (D231 item 2)
  cv_groups: true  # ridge's alpha on folds grouped by bearing, shuffled per seed (D232 item 5)
  cv_folds: 4  # as DSCN's 4-fold cross-validation (Section 4.1.4)
  time_window: 5  # DSCN Eq. 16, S = 5, on the representations; minutes 1-4 of each bearing left out (D232 item 4)
  rul_metrics: true  # DSCN score + RMSE (minutes), MAE + R², minutes n >= N/2 of each test bearing (D232 item 6)
  published_accuracy: null  # DSCN is a supervised network; no probe result to compare with
