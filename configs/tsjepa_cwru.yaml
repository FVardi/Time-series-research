# CWRU literature protocol (Zhao et al. 2020; D167, D177-D179): 10 classes, drive end, 0 hp, 1,024-sample windows.
# TS-JEPA (masking fixed, channels flattened per patch) on CWRU (D167, D151, D154).
defaults: [datasets/cwru.yaml, methods/tsjepa.yaml]  # shared settings (D260), merged in this order; keys below override them
name: tsjepa_cwru

tsjepa:
  epochs: 5000  # D66; paper silent; code 5001 (README evaluates the checkpoint saved at epoch index 5000); 1 epoch = 113 batches on FordA
