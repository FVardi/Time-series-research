# TS-JEPA epoch diagnostic (D200): RankMe and validation accuracy during pretraining, CWRU literature protocol (D218).
name: tsjepa_epochs_cwru
base_config: configs/tsjepa_cwru.yaml  # data, split, standardisation and TS-JEPA settings exactly as that run (D218; was the main task, D163)
seed: 0                     # the run's seed (D219)
every: 250                  # epochs between measurements (also before the first epoch and after the last)
validation_fraction: 0.2    # of the training windows, stratified by class; the probe is fitted on the rest (D200)
validation_random_state: 0  # one fixed draw
rankme_epsilon: 1.0e-7      # as the runs (D152)
