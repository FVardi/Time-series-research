# Spectral probe (D244) on Paderborn (Lessmeier 7.3, D220): the six TF-C variants and the other methods'
# standard runs (D256) x 10 combinations. Listed by combination, so the windows of each combination are
# rebuilt once. Not yet: TS-JEPA and FreRA (their 10 combinations are not all finished).
name: paderborn
targets: [absolute, relative, total, centroid]  # D244
n_bands: 16  # equal-width bands from 0 to Nyquist (D244)
label_fractions: [1.0]  # all training windows: the targets need no labelling (D246, supersedes D244's 1/10/100 %)
seed: 0  # seed_0 of every run; label subsets and folds drawn with it (D239, D244)
alphas: [1.0e-6, 1.0e-5, 0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0, 1.0e+5, 1.0e+6, 1.0e+7, 1.0e+8]  # 10^-6..10^8 (D246; wider than D58's 10^-4..10^4)
cv_groups: true  # folds grouped by bearing, as the benchmark (D129)
cv_folds: 5  # as D129
fft_reference: true  # |rfft| of the same windows, probed the same way (D244)
per_bearing: false  # Pearson's r per test bearing (D265): bearings in fixed states, no life trajectory
