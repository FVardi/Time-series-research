# Split-representation pilot (D182), variant 0, cwru. Written by make_configs.py.
name: pilot_0_cwru
dataset: cwru
data_root: data/canonical
channels: [DE, FE]  # D131
windows:  # D136, D137
  length: 2048
  sample_rate_hz: 12000  # normal files (48 kHz) resampled to 12 kHz
  standardise: true  # per channel, statistics of the pretraining windows (D137)
labels: cwru  # D118, D125
split:  # random windows (D163, D164, D171, D174)
  captures: {sample_rate_hz: 12000, fault_end: [DE, FE], fault_size_mil: [7, 14, 21]}
  random_windows: {test_fraction: 0.2, random_state: 40}
  pretrain_only: {fault_end: [none]}
method: ts2vec
seeds: [0, 1, 2]
device: cuda
rankme_epsilon: 1.0e-7  # D152, diagnostic only

ts2vec:  # official settings (D28) except batch size (D183, D185)
  repr_dims: 320
  hidden_dims: 64
  depth: 10
  lr: 0.001
  batch_size: 64  # D183 item 6 (official: 8)
  max_train_length: 3000
  temporal_unit: 0
  n_iters: 600  # D185 item 2

evaluation:  # as configs/ts2vec_cwru.yaml
  label_fractions: [0.01, 0.1, 1.0]
  probes: [logreg, floor]
  cv_groups: false  # D175
  published_accuracy: null
