# Split-representation pilot (D182), variant 0, synthetic_loso2400. Written by make_configs.py.
name: pilot_0_synthetic_loso2400
dataset: synthetic_crossed
data_root: data/canonical
channels: [AE, US]
labels: synthetic_shared
windows:
  length: 1024
  sample_rate_hz: 10000  # the generated rate (D196)
  standardise: true  # per channel, statistics of the pretraining windows (as D137)
split:
  train: {speed_rpm: [600, 1200, 1800]}
  test: {speed_rpm: [2400]}
  pretrain_only: {speed_rpm: []}  # none
method: ts2vec
seeds: [0, 1, 2]
device: cuda
rankme_epsilon: 1.0e-7  # D152, diagnostic only

ts2vec:  # official settings (D28) except batch size (D183, D185)
  repr_dims: 320
  hidden_dims: 64
  depth: 10
  lr: 0.001
  batch_size: 64  # D183 item 6 (official: 8)
  max_train_length: 3000
  temporal_unit: 0
  n_iters: 600  # D185 item 2

evaluation:
  label_fractions: [0.01, 0.1, 1.0]
  probes: [logreg, floor]
  cv_groups: false  # plain stratified 5-fold (as D175)
  published_accuracy: null
