# Split-representation pilot (D182), variant B0.1, synthetic_departures. Written by make_configs.py.
name: pilot_B0.1_synthetic_departures
dataset: synthetic_departures
data_root: data/canonical
channels: [AE, US]
labels: synthetic_shared
windows:
  length: 1024
  sample_rate_hz: 10000  # the generated rate (D196)
  standardise: true  # per channel, statistics of the pretraining windows (as D137)
conditions: [speed_rpm, temperature_c]  # one head per factor (D197, D198)
split:
  train: {departure: [false]}
  test: {departure: [true], bearing: [B0, B1]}
  pretrain_only: {departure: [true], bearing: [B2, B3]}
method: ts2vec_split
seeds: [0, 1, 2]
device: cuda
rankme_epsilon: 1.0e-7  # D152, diagnostic only

ts2vec_split:  # D183, D185, D197
  repr_dims: 320
  hidden_dims: 64
  depth: 10
  lr: 0.001
  batch_size: 64  # D183 item 6 (official: 8)
  max_train_length: 3000
  temporal_unit: 0
  n_iters: 600  # D185 item 2
  z_op_dims: 32  # D183 item 1
  head_hidden: 64  # D185 item 5
  op_weight: 1.0  # D185 item 4
  removal: adversary  # D182 item 3
  removal_weight: 0.1  # D185 item 4
  ramp_max: 1.0  # D185 item 3

evaluation:
  label_fractions: [0.01, 0.1, 1.0]
  probes: [logreg, floor]
  cv_groups: false  # plain stratified 5-fold (as D175)
  published_accuracy: null
