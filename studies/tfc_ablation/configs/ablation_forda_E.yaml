# TF-C study, part 2: ablation by building blocks, stage E on FordA (D96, D97).
# Stage E: full TF-C, λ(L_T + L_F) + (1 − λ) L_C.
# Every setting is written out; 'null' marks an open placeholder and the run refuses to start.
name: ablation_forda_E
stage: E
dataset: forda
run_id: forda
train_split: train  # pretraining, diagnostics and probe training (3,601 series of 500 samples)
test_split: test  # probe scoring only, once (D26)
channels: [x]
data_root: data/canonical
seeds: [0]  # D96: one seed as a check first; up to 3 later
device: cuda

evaluation:  # frozen probes, D26 / D29 protocol on FordA; label budgets D40
  representations: [h_t, h_f, h, z]  # D96, D97
  label_fractions: [0.01, 0.1, 1.0]
  probes: [svm_ts2vec, logreg]

tfc:  # our TF-C (D41, D42), settings as in configs/tfc_fd.yaml; held fixed across stages (D96)
  encoder:  # D41 item 1: the paper's CNN, both branches
    channels: [32, 64, 128]  # paper
    kernel_size: 8  # paper
    strides: [8, 1, 1]  # paper
    padding: 4  # not in paper; 2022 code (kernel_size // 2)
    pool_padding: 1  # not in paper; 2022 code
    conv_bias: false  # not in paper; 2022 code
    dropout_block1: 0.35  # not in paper; 2022 code (dropout after the first block only)
    projector: [256, 128]  # paper
  loss:  # D41 item 4, paper
    temperature: 0.2
    lambda: 0.5
    delta: 1.0
  freq_aug:  # D41 item 3 (user's design), paper values
    n_components: 1  # E
    alpha: 0.5
  time_aug:  # D42
    jitter_sigma: 0.1  # official code (FD_A config jitter_ratio)
    scaling_mean: 1.0  # our choice, approved in D42
    scaling_sigma: 0.1  # our choice, approved in D42
    max_segments: 5  # official code (max_seg)
  pretrain:  # D41 item 5
    epochs: 40  # paper
    batch_size: 64  # paper
    drop_last: true  # code; NT-Xent batches of equal size
    lr: 0.0003  # paper
    betas: [0.9, 0.99]  # code (paper silent)
    weight_decay: 0.0005  # paper
  eval_chunk: 512  # windows per forward pass when measuring; does not change results

diagnostics:  # D93, D94. 'null' = open placeholder: the run refuses to start
  representations: [h_t, h_f, h, z_t, z_f, z]  # D94, D96: what stage E produces; h = [h_T; h_F], z = [z_T; z_F]
  windows: all  # D94: all 3,601 FordA training windows
  seed: 0  # D94; seed for the diagnostic subset, the fixed augmented views and the SIGReg directions
  alignment: true  # D94: also cosine(window, its augmented version), augmented views drawn once
  rankme_epsilon: 1.0e-7  # D94 (our choice; the paper gives no value for epsilon in RankMe's p_k)
  std_threshold_relative: 0.01  # D94: a dimension is 'dead' if its std < 1 % of the largest std of that representation
  sigreg:  # official LeJEPA code, commit c293d29 (EppsPulley, trapezoid; SlicingUnivariateTest)
    t_max: 3  # official EppsPulley default and MINIMAL.md
    n_points: 17  # official default and MINIMAL.md (knots)
    n_slices: 1024  # D94; official README quick start (MINIMAL.md uses 256)
    same_directions_every_epoch: true  # D94, so epochs are comparable (the official code draws new directions every call)
